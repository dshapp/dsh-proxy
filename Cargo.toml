[package]
name = "dsh-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "dsh mobile access proxy: one port, no TLS, no state, routes by 32-byte bridge key"

[dependencies]
base64 = "0.22"
bytes = "1"
dashmap = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# ring-accelerated: ring's assembly ChaChaPoly/SHA256 backend for the bridge
# link. Measured 3x faster than the pure-Rust default at our 16 KiB frame.
snow = { version = "0.9", features = ["ring-accelerated"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
